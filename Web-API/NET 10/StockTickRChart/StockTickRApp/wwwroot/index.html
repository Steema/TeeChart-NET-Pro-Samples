<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <title>ASP.NET Core SignalR Stock Ticker</title>
  <link href="StockTicker.css" rel="stylesheet" />
  <script src="https://www.steema.com/files/public/teechart/html5/latest/src/teechart.js" type="text/javascript"></script>
</head>
<body>
  <h1>Steema Software - Adaptation for TeeChart</h1>
  <h1>ASP.NET SignalR Stock Ticker Sample</h1>
  
  <div>
    See: <a href="https://github.com/aspnet/SignalR-samples/tree/main/StockTickR">Microsoft SignalR-samples</a>
    <br />
    <br />
  </div>

  <input type="button" id="open" value="Open Market" />
  <input type="button" id="close" value="Close Market" disabled="disabled" />
  <input type="button" id="reset" value="Reset" />

  <h2>Live Stock Table</h2>
  <div id="stockTable">
    <table border="1">
      <thead>
        <tr><th>Symbol</th><th>Price</th><th>Open</th><th>High</th><th>Low</th><th>Change</th><th>%</th><th>O.H.L.P</th></tr>
      </thead>
      <tbody>
      </tbody>
    </table>
  </div>

  <div>
    <img src="img/legend.jpg" />
    <br />
  </div>

  <h2>Live Stock Ticker</h2>
  <div id="stockTicker">
    <div class="inner">
      <ul position="absolute">
      </ul>
    </div>
  </div>

  <script src="lib/signalr.min.js"></script>
  <script src="lib/stockTicker.js"></script>
</body>
</html>
